name: Bug report
description: Report a reproducible MMG AI Router problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 1.0.9"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - One-click connection
        - API providers
        - Model Router / fallback
        - Local System Agent
        - Codex diagnostics
        - License / trial
        - Logs / settings
        - Installation / startup
        - Other
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Do not include API keys, tokens, Device IDs, license keys or private logs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
